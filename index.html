<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Für dich 🌿</title>
  <style>
    :root {
      --bg1: #fffdf8;
      --bg2: #f7efe8;
      --text: #4f6654;
      --soft: #8f7275;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 28%, rgba(255,255,255,.96) 0 18%, transparent 52%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    main {
      width: min(94vw, 900px);
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      place-items: center;
      text-align: center;
      padding: clamp(20px, 4vw, 44px);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 4.7rem);
      line-height: 1;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp .9s ease .2s forwards;
    }

    .subtitle, .message {
      color: var(--soft);
      font-size: clamp(1rem, 2.8vw, 1.3rem);
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp .9s ease .55s forwards;
    }

    .stage {
      width: min(88vw, 620px);
      display: grid;
      place-items: center;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 78%;
      height: 78%;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(167, 190, 158, .25), transparent 68%);
      filter: blur(22px);
      opacity: 0;
      animation: fadeOnly 1.4s ease .8s forwards;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 24px 22px rgba(58,70,54,.16));
      opacity: 0;
      transform: translateY(18px) scale(.985);
      animation: bouquetIn 1.6s ease .85s forwards;
    }

    .message {
      margin: 0;
      animation-delay: 1.55s;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: none; }
    }

    @keyframes fadeOnly {
      to { opacity: 1; }
    }

    @keyframes bouquetIn {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Für dich 🌿</h1>
      <p class="subtitle">Ein kleiner virtueller Blumenstrauß, der nie verwelkt.</p>
    </header>

    <section class="stage" aria-label="Virtueller Blumenstrauß">
      <div class="glow"></div>
      <img src="bouquet.png" alt="Botanischer Blumenstrauß mit grünen Zweigen und zarten Blüten" />
    </section>

    <p class="message">Ich hoffe, dieser kleine Strauß bringt dir ein Lächeln.</p>
  </main>
</body>
</html>
