<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Für dich</title>

<style>
:root{
    --bg1:#f9fcff;
    --bg2:#e8f3ff;
    --text:#4f6654;
    --soft:#8a7d92;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(
        circle at 50% 25%,
        rgba(255,255,255,.95) 0%,
        rgba(232,243,255,.35) 35%,
        transparent 60%
    ),
    linear-gradient(180deg,var(--bg1),var(--bg2));

    font-family:
        ui-rounded,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:var(--text);
}

main{
    width:min(95vw,1000px);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    gap:14px;

    padding:40px 20px;
}

h1{
    margin:0;

    font-size:clamp(3.5rem,9vw,6rem);
    line-height:1;

    opacity:0;
    transform:translateY(12px);

    animation:fadeUp .9s ease .2s forwards;
}

.subtitle{
    margin:0;

    color:var(--soft);

    font-size:clamp(1.1rem,3vw,1.5rem);

    opacity:0;
    transform:translateY(12px);

    animation:fadeUp .9s ease .45s forwards;
}

.stage{
    width:min(90vw,760px);

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    margin:10px 0;
}

.glow{
    position:absolute;

    width:75%;
    height:75%;

    border-radius:999px;

    background:
        radial-gradient(
            circle,
            rgba(167,190,158,.18),
            transparent 70%
        );

    filter:blur(30px);

    opacity:0;

    animation:fadeOnly 1.4s ease .7s forwards;
}

.bouquet{
    width:100%;
    max-width:720px;
    height:auto;

    position:relative;
    z-index:1;

    display:block;

    user-select:none;
    -webkit-user-drag:none;

    filter:
        drop-shadow(
            0 18px 18px rgba(58,70,54,.15)
        );

    opacity:0;
    transform:translateY(15px) scale(.98);

    animation:bouquetIn 1.6s ease .8s forwards;
}

.message{
    margin:0;

    color:var(--soft);

    font-size:clamp(1.1rem,2.5vw,1.35rem);

    opacity:0;
    transform:translateY(12px);

    animation:fadeUp .9s ease 1.4s forwards;
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes fadeOnly{
    to{
        opacity:1;
    }
}

@keyframes bouquetIn{
    to{
        opacity:1;
        transform:none;
    }
}

@media (prefers-reduced-motion:reduce){
    *{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
    }
}
</style>
</head>

<body>

<main>

    <h1>Für dich</h1>

    <p class="subtitle">
        Ein kleiner virtueller Blumenstrauß, der nie verwelkt.
    </p>

    <section class="stage">

        <div class="glow"></div>

        <img
            class="bouquet"
            src="bouquet.png"
            alt="Botanischer Blumenstrauß">

    </section>

    <p class="message">
        „Für die Tage, an denen ich dir gerne echte Blumen schenken würde.“ 🌸
    </p>

</main>

</body>
</html>
